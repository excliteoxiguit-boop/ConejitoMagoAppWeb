name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build APK disabling Kotlin daemon and flow services
      run: |
        # Desactivar servicios de demonio y estadísticas que causan incompatibilidad con Gradle nuevo
        export ORG_GRADLE_PROJECT_kotlin.daemon.enabled=false
        export ORG_GRADLE_PROJECT_kotlin.caching.enabled=true
        
        # Compilar el módulo de la aplicación ignorando las propiedades internas obsoletas
        gradle -p app assembleDebug --no-daemon -Pandroid.defaults.buildfeatures.buildconfig=true
      continue-on-error: true

    - name: Fallback Build if needed
      run: |
        if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          gradle assembleDebug --no-daemon || true
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ConejitoMago-APK
        path: |
          app/build/outputs/apk/debug/*.apk
          build/outputs/apk/debug/*.apk
          **/build/outputs/apk/debug/*.apk
