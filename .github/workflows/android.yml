name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Debug APK
      run: |
        # Compilar pasando la propiedad directamente a Gradle sin usar variables de entorno con puntos
        gradle -p app assembleDebug --no-daemon -Pkotlin.daemon.enabled=false || gradle assembleDebug --no-daemon -Pkotlin.daemon.enabled=false

    - name: Find and Copy APK to root for Artifacts
      run: |
        mkdir -p final-apk
        find . -name "*.apk" -exec cp {} final-apk/ \;

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ConejitoMago-APK
        path: final-apk/*.apk
