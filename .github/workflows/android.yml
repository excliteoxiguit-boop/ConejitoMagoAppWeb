name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build APK with Android Command Line Tools
      run: |
        # Configurar permisos de gradle y compilar de forma directa en la raíz
        export ANDROID_HOME=$HOME/android-sdk
        if [ -f "./build.gradle" ] || [ -f "./build.gradle.kts" ]; then
          gradle assembleDebug
        elif [ -f "./app/build.gradle" ] || [ -f "./app/build.gradle.kts" ]; then
          cd app && gradle assembleDebug
        else
          # Si Gradle global no está presente, descargamos las herramientas mínimas
          echo "Buscando gradle..."
          gradle assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ConejitoMago-APK
        path: |
          app/build/outputs/apk/debug/*.apk
          build/outputs/apk/debug/*.apk
          **/build/outputs/apk/debug/*.apk
