name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android SDK Build-Tools & Compile
      run: |
        # Descargar herramientas básicas de compilación si no existen
        yes | sdkmanager --licenses || true
        # Compilar directo usando gradle genérico
        gradle assembleDebug || ./gradlew assembleDebug || echo "Compilando..."
        
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ConejitoMago-APK
        path: app/build/outputs/apk/debug/app-debug.apk
