name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build APK bypassing build flow service
      run: |
        cd app
        # Compilar desactivando las estadísticas y servicios de flujo de Kotlin que causan el conflicto
        gradle assembleDebug -Pkotlin.daemon.enabled=false --no-daemon
      continue-on-error: true

    - name: Alternative Build if needed
      run: |
        if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          gradle assembleDebug --no-daemon || true
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ConejitoMago-APK
        path: |
          app/build/outputs/apk/debug/*.apk
          build/outputs/apk/debug/*.apk
          **/build/outputs/apk/debug/*.apk
