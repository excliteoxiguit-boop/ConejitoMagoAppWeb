name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Gradle & Build Debug APK
      run: |
        sudo apt-get update && sudo apt-get install -y gradle
        # Compilar ejecutando gradle desde la ruta correcta o buscando el gradlew interno
        if [ -f "./app/gradlew" ]; then
          cd app && ./gradlew assembleDebug
        elif [ -f "./gradlew" ]; then
          ./gradlew assembleDebug
        else
          gradle -b app/build.gradle assembleDebug || gradle assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ConejitoMago-APK
        path: |
          app/build/outputs/apk/debug/*.apk
          build/outputs/apk/debug/*.apk
          **/build/outputs/apk/debug/*.apk
